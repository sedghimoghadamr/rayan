<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سایت رایان</title>
    <style>
        body { 
            font-family: 'Tahoma', sans-serif; 
            text-align: center; 
            background-color: #eef2f7; 
            margin-top: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; }
        button { 
            padding: 10px 25px; 
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>به سایت رایان خوش آمدید</h1>
        <p>این اولین قدم برای ساخت دنیای دیجیتال شماست.</p>
        <button onclick="sayHello()">کلیک کنید</button>
    </div>

    <script>
        function sayHello() {
            alert("خوش آمدید به دنیای رایان!");
        }
    </script>

</body>
</html>
